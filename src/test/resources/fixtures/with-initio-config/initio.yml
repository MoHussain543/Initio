environment:
  required:
    - INTERNAL_API_KEY
    - STRIPE_SECRET_KEY

runtimes:
  java: "25"
  node: ">=22"

commands:
  - name: integration-tests
    category: TEST
    command: "./scripts/integration-test.sh"

services:
  - name: redis
    port: 6379

ignore:
  - "env:LEGACY_API_KEY"
  - "port:3001"
  - "rule:DECLARATION_DRIFT"
